name: umbra
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: umbra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.public}
      POSTGRES_DB: umbra
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umbra -d umbra"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    image: umbra-api:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["migrate"]
    environment:
      DATABASE_URL: postgresql://umbra:${POSTGRES_PASSWORD}@database:5432/umbra
    depends_on:
      database:
        condition: service_healthy
  worker:
    image: umbra-worker:local
    build:
      context: .
      dockerfile: worker.Dockerfile
    environment:
      UMBRA_DATA_DIR: /data
      UMBRA_WORKER_TOKEN: ${UMBRA_WORKER_TOKEN:?Set UMBRA_WORKER_TOKEN in .env.public}
    volumes:
      - footage:/data
    init: true
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8001/health',headers={'Authorization':'Bearer '+os.environ['UMBRA_WORKER_TOKEN']}))"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  api:
    image: umbra-api:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${UMBRA_BIND_ADDRESS:-127.0.0.1}:${UMBRA_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://umbra:${POSTGRES_PASSWORD}@database:5432/umbra
      UMBRA_DATA_DIR: /data
      UMBRA_FRONTEND_DIR: /app/frontend
      UMBRA_PUBLIC_URL: ${UMBRA_PUBLIC_URL:-http://localhost:8000}
      UMBRA_ENV: ${UMBRA_ENV:-development}
      UMBRA_TRUSTED_PROXY_CIDRS: ${UMBRA_TRUSTED_PROXY_CIDRS:-}
      UMBRA_WORKER_URL: http://worker:8001
      UMBRA_WORKER_TOKEN: ${UMBRA_WORKER_TOKEN}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - footage:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_healthy
    init: true
    restart: unless-stopped
volumes:
  database:
  footage:
