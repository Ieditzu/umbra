[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "umbra-server"
version = "0.1.0"
description = "Time-aware pedestrian routing and building-shadow geometry for Umbra"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "httpx>=0.28,<1", "networkx>=3.4,<4", "shapely>=2.1,<3", "pyproj>=3.7,<4", "pvlib>=0.13,<1", "defusedxml>=0.7,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["umbra_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
