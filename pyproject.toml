[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "umbra"
version = "0.1.0"
description = "Confidence-aware hidden-motion experiment kit for corner-light research"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Umbra contributors" }]
dependencies = [
  "astral>=3.2,<4",
  "fastapi>=0.115,<1",
  "numpy>=2.1,<3",
  "opencv-contrib-python-headless>=4.10,<5",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.12,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
ml = ["torch>=2.5"]
dev = [
  "httpx>=0.27",
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
umbra-api = "umbra.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/umbra"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
